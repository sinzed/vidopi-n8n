# Publishes n8n-nodes-vidopi to npm on version tag push with npm provenance.
#
# Required for n8n community node verification from May 1, 2026:
# https://docs.n8n.io/integrations/creating-nodes/deploy/submit-community-nodes/
#
# ONE-TIME SETUP (npm Trusted Publisher — recommended):
# 1. https://www.npmjs.com/package/n8n-nodes-vidopi → Settings → Trusted Publishers
# 2. Add GitHub Actions publisher:
#    - Repository owner: sinzed
#    - Repository name: vidopi-n8n
#    - Workflow filename: publish.yml
# 3. Leave NPM_TOKEN unset; GitHub OIDC is used for publish + provenance.
#
# Alternative: create NPM_TOKEN (granular publish) in repo Secrets → Actions.
#
# RELEASE:
# 1. Bump "version" in package.json and commit
# 2. git tag 2.0.2 && git push origin main && git push origin 2.0.2
# 3. This workflow runs lint, build, and npm publish --provenance

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish to npm with provenance
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
